# One-off: prints the official Javadoc of a few newer Android APIs from the SDK sources.
name: API notes
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/api-notes.yml"]
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - name: Print API notes
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          echo "== available"
          $SDKM --list 2>/dev/null | grep -E "^ *(sources|platforms);android-3[4-9]" | sort -u || true
          yes | $SDKM "sources;android-37.2" > /dev/null 2>&1 || true
          ls $ANDROID_HOME/sources $ANDROID_HOME/platforms || true
          cat > /tmp/notes.py <<'PY'
          import re, sys
          path, names = sys.argv[1], sys.argv[2].split(',')
          text = open(path).read()
          for name in names:
              for m in re.finditer(r'(/\*\*(?:(?!\*/).)*?\*/)\s*((?:@[^\n]*\n\s*)*)(public[^\n{;]*\b' + re.escape(name) + r'\s*\([^)]*\))', text, re.S):
                  print('-' * 70)
                  print(m.group(1)); print(m.group(2).strip()); print(m.group(3))
          PY
          S=$ANDROID_HOME/sources/android-37.2
          ls $S/android/bluetooth | head -5 || true
          F=$S/android/bluetooth/BluetoothDevice.java
          for m in "disconnect()" "connect()" "disconnectAcl" "isConnected()"; do
            for n in $(grep -n "public .*[ .]${m}" $F | cut -d: -f1); do
              echo "=================== $m at line $n"
              sed -n "$((n-60)),$((n+2))p" $F
            done
          done
